<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Área do Estudante{% endblock %}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f8fb;
            color: #1f2933;
        }
        header {
            background-color: #2563eb;
            color: white;
            padding: 1.5rem;
        }
        nav a {
            color: white;
            margin-right: 1rem;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            max-width: 960px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        }
        .info-card {
            background-color: #e0edff;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        footer {
            text-align: center;
            padding: 2rem 0;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Área do Estudante</h1>
        <nav>
            <a href="{% url 'student:dashboard' %}">Dashboard</a>
            <a href="{% url 'student:profile' %}">Perfil</a>
            <a href="{% url 'student:resume' %}">Currículo</a>
            <a href="{% url 'student:job_list' %}">Vagas</a>
            <a href="{% url 'student:applications' %}">Minhas Candidaturas</a>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        JobPathAI · protótipo da área do estudante
    </footer>
</body>
</html>
