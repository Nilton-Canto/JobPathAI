<!DOCTYPE html>
<html lang="pt-PT" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPathAI - Meu Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Navbar (Barra de Navegação Principal) -->
        <nav class="bg-white shadow-sm border-b border-gray-200 relative z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                             <a href="dashboard.html" class="flex items-center gap-2">
                                <div class="h-8 w-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm rotate-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-white">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
                                    </svg>
                                </div>
                                <span class="text-xl font-bold text-gray-800 hidden sm:block">JobPathAI</span>
                             </a>
                        </div>
                        <div class="hidden sm:-my-px sm:ml-6 sm:flex sm:space-x-8">
                            <a href="dashboard.html" class="inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium border-blue-500 text-gray-900" aria-current="page">
                                Meu Painel
                            </a>
                            <a href="explorar-trilhas.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Explorar Trilhas
                            </a>
                            <a href="chat-mentor.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Mentor IA
                            </a>
                        </div>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:items-center">
                        <!-- Dropdown do Perfil -->
                        <div class="ml-3 relative">
                            <div>
                                <button type="button" class="bg-white rounded-full flex text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                                    <span class="sr-only">Abrir menu do utilizador</span>
                                    <img class="h-8 w-8 rounded-full object-cover border-2 border-gray-200" src="https://via.placeholder.com/150/0000FF/FFFFFF?text=U" alt="Foto do Utilizador">
                                </button>
                            </div>
                            <!-- Menu Dropdown -->
                            <div id="user-menu-dropdown" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden transition-all duration-200 ease-out transform opacity-0 scale-95" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                                <a href="perfil.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center" role="menuitem" tabindex="-1" id="user-menu-item-0">
                                    <i data-lucide="user" class="w-4 h-4 mr-2 text-gray-400"></i>
                                    Meu Perfil
                                </a>
                                <a href="admin-trilhas.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center" role="menuitem" tabindex="-1" id="user-menu-item-1">
                                    <i data-lucide="settings" class="w-4 h-4 mr-2 text-gray-400"></i>
                                    Admin
                                </a>
                                <div class="border-t border-gray-100 my-1"></div>
                                <a href="login.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors flex items-center" role="menuitem" tabindex="-1" id="user-menu-item-2">
                                    <i data-lucide="log-out" class="w-4 h-4 mr-2 text-red-500"></i>
                                    Sair
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Cabeçalho da Página -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <h1 class="text-3xl font-bold leading-tight text-gray-900">
                    Meu Painel
                </h1>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <main>
            <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
                <div class="px-4 py-6 sm:px-0">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- Coluna Principal (Progresso) -->
                        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-lg border border-gray-100">
                            <h3 class="text-xl font-semibold text-gray-900 mb-4 flex items-center">
                                <i data-lucide="activity" class="w-5 h-5 mr-2 text-blue-600"></i>
                                Progresso da Trilha Atual
                            </h3>
                            <div class="mb-4">
                                <div class="flex justify-between mb-1">
                                    <span class="text-base font-medium text-blue-700">Desenvolvedor Full Stack</span>
                                    <span class="text-sm font-medium text-blue-700">45%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-4 shadow-inner">
                                    <div class="bg-blue-600 h-4 rounded-full transition-all duration-500" style="width: 45%"></div>
                                </div>
                            </div>
                            <p class="text-gray-600 mb-5">Você completou 4 de 9 etapas. A sua próxima etapa é "JavaScript Moderno (ES6+)".</p>
                            <a href="meu-plano.html" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
                                <i data-lucide="play" class="w-4 h-4 mr-2 -ml-1"></i>
                                Continuar Trilha
                            </a>
                        </div>
                        
                        <!-- Coluna Lateral (Ações Rápidas) -->
                        <div class="bg-white p-6 rounded-lg shadow-lg border border-gray-100">
                            <h3 class="text-xl font-semibold text-gray-900 mb-4 flex items-center">
                                <i data-lucide="zap" class="w-5 h-5 mr-2 text-yellow-500"></i>
                                Ações Rápidas
                            </h3>
                            <div class="space-y-3">
                                <a href="explorar-trilhas.html" class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition-all hover:border-gray-400">
                                    <i data-lucide="compass" class="w-5 h-5 mr-2 text-gray-500"></i>
                                    Explorar Novas Trilhas
                                </a>
                                <a href="criar-plano-ia.html" class="w-full flex items-center justify-center px-4 py-3 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gray-800 hover:bg-gray-900 transition-all">
                                    <i data-lucide="sparkles" class="w-5 h-5 mr-2 text-blue-400"></i>
                                    Criar Plano com IA
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Inicializa os ícones Lucide
        lucide.createIcons();

        // Lógica do Dropdown do Menu de Utilizador
        const userMenuButton = document.getElementById('user-menu-button');
        const userMenuDropdown = document.getElementById('user-menu-dropdown');

        if (userMenuButton && userMenuDropdown) {
            userMenuButton.addEventListener('click', () => {
                const isExpanded = userMenuButton.getAttribute('aria-expanded') === 'true';
                userMenuButton.setAttribute('aria-expanded', !isExpanded);
                
                if (!isExpanded) {
                    // Abrir
                    userMenuDropdown.classList.remove('hidden');
                    // Pequeno timeout para permitir que a transição CSS ocorra
                    setTimeout(() => {
                        userMenuDropdown.classList.remove('opacity-0', 'scale-95');
                        userMenuDropdown.classList.add('opacity-100', 'scale-100');
                    }, 10);
                } else {
                    // Fechar
                    userMenuDropdown.classList.remove('opacity-100', 'scale-100');
                    userMenuDropdown.classList.add('opacity-0', 'scale-95');
                    // Espera a transição terminar antes de esconder
                    setTimeout(() => {
                         userMenuDropdown.classList.add('hidden');
                    }, 200); // Tempo deve corresponder ao duration-200 do Tailwind
                }
            });

            // Fecha o dropdown se clicar fora dele
            document.addEventListener('click', (event) => {
                if (!userMenuButton.contains(event.target) && !userMenuDropdown.contains(event.target)) {
                    if (userMenuButton.getAttribute('aria-expanded') === 'true') {
                         userMenuButton.setAttribute('aria-expanded', 'false');
                         userMenuDropdown.classList.remove('opacity-100', 'scale-100');
                         userMenuDropdown.classList.add('opacity-0', 'scale-95');
                         setTimeout(() => {
                              userMenuDropdown.classList.add('hidden');
                         }, 200);
                    }
                }
            });
        }
    </script>
</body>
</html>
