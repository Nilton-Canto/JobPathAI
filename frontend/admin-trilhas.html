<!DOCTYPE html>

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;

    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <nav class="bg-gray-900 shadow-sm border-b border-gray-800 relative z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                             <a href="dashboard.html" class="flex items-center gap-2">
                                <div class="h-8 w-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm">
                                    <span class="text-white font-bold text-lg">JP</span>
                                </div>
                                <span class="text-xl font-bold text-white hidden sm:block">Admin Panel</span>
                             </a>
                        </div>
                        <div class="hidden sm:-my-px sm:ml-6 sm:flex sm:space-x-8">
                            <a href="admin-trilhas.html" class="border-blue-500 text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" aria-current="page">
                                Trilhas
                            </a>
                            <a href="#" class="border-transparent text-gray-300 hover:border-gray-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Áreas
                            </a>
                            <a href="#" class="border-transparent text-gray-300 hover:border-gray-300 hover:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Utilizadores
                            </a>
                        </div>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:items-center">
                        <a href="dashboard.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium flex items-center mr-4">
                            <i data-lucide="arrow-left-circle" class="w-4 h-4 mr-2"></i>
                            Voltar ao Site
                        </a>
                        
                        <div class="ml-3 relative">
                            <div>
                                <button type="button" class="bg-gray-800 rounded-full flex text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                                    <span class="sr-only">Abrir menu do utilizador</span>
                                    <img class="h-8 w-8 rounded-full object-cover" src="https://via.placeholder.com/150/0000FF/FFFFFF?text=U" alt="Foto do Utilizador">
                                </button>
                            </div>
                            <div id="user-menu-dropdown" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden transition-all duration-200 ease-out transform opacity-0 scale-95" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                                <a href="perfil.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors flex items-center" role="menuitem" tabindex="-1">
                                    <i data-lucide="user" class="w-4 h-4 mr-2 text-gray-400"></i>
                                    Meu Perfil
                                </a>
                                <div class="border-t border-gray-100 my-1"></div>
                                <a href="login.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors flex items-center" role="menuitem" tabindex="-1">
                                    <i data-lucide="log-out" class="w-4 h-4 mr-2 text-red-500"></i>
                                    Sair
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <h1 class="text-2xl font-bold leading-tight text-gray-900">
                    Gerir Trilhas de Carreira
                </h1>
                <a href="admin-nova-trilha.html" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <i data-lucide="plus" class="w-5 h-5 mr-2 -ml-1"></i>
                    Nova Trilha
                </a>
            </div>
        </header>

        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            
            <div class="flex flex-col">
                <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                    <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
                        <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Nome da Trilha
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Área
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Etapas
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Status
                                        </th>
                                        <th scope="col" class="relative px-6 py-3">
                                            <span class="sr-only">Ações</span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="flex items-center">
                                                <div class="flex-shrink-0 h-10 w-10 bg-blue-100 rounded-lg flex items-center justify-center">
                                                    <i data-lucide="code-2" class="w-5 h-5 text-blue-600"></i>
                                                </div>
                                                <div class="ml-4">
                                                    <div class="text-sm font-medium text-gray-900">
                                                        Desenvolvimento Frontend
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                                Tecnologia
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            9 etapas
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                                Ativo
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <a href="#" class="text-blue-600 hover:text-blue-900 mr-4">Editar</a>
                                            <a href="#" class="text-red-600 hover:text-red-900">Excluir</a>
                                        </td>
                                    </tr>

                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Lógica do Dropdown do Menu de Utilizador (Admin)
        const userMenuButton = document.getElementById('user-menu-button');
        const userMenuDropdown = document.getElementById('user-menu-dropdown');

        if (userMenuButton && userMenuDropdown) {
            userMenuButton.addEventListener('click', () => {
                const isExpanded = userMenuButton.getAttribute('aria-expanded') === 'true';
                userMenuButton.setAttribute('aria-expanded', !isExpanded);
                
                if (!isExpanded) {
                    // Abrir
                    userMenuDropdown.classList.remove('hidden');
                    setTimeout(() => {
                        userMenuDropdown.classList.remove('opacity-0', 'scale-95');
                        userMenuDropdown.classList.add('opacity-100', 'scale-100');
                    }, 10);
                } else {
                    // Fechar
                    userMenuDropdown.classList.remove('opacity-100', 'scale-100');
                    userMenuDropdown.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => {
                         userMenuDropdown.classList.add('hidden');
                    }, 200);
                }
            });

            // Fecha o dropdown se clicar fora dele
            document.addEventListener('click', (event) => {
                if (!userMenuButton.contains(event.target) && !userMenuDropdown.contains(event.target)) {
                    if (userMenuButton.getAttribute('aria-expanded') === 'true') {
                         userMenuButton.setAttribute('aria-expanded', 'false');
                         userMenuDropdown.classList.remove('opacity-100', 'scale-100');
                         userMenuDropdown.classList.add('opacity-0', 'scale-95');
                         setTimeout(() => {
                              userMenuDropdown.classList.add('hidden');
                         }, 200);
                    }
                }
            });
        }
    </script>
</body>
</html>
